    <script>
      // 1. Guard against browser extensions attempting to assign to read-only or getter-only window.fetch
      (function() {
        try {
          var nativeFetch = window.fetch;
          var interceptedFetch = typeof nativeFetch === 'function' ? function() {
            return nativeFetch.apply(window, arguments);
          } : nativeFetch;

          var descriptor = {
            get: function() {
              return interceptedFetch;
            },
            set: function(fn) {
              interceptedFetch = fn;
            },
            configurable: true,
            enumerable: true
          };

          // Define setter on Window.prototype so prototype lookups find a setter
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e1) {}

          // Define setter directly on window so own-property assignment succeeds
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e2) {}

          // Fallback for globalThis
          try {
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            }
          } catch (e3) {}
        } catch (err) {}

        // 2. Prevent third-party browser extension errors from bubbling to app error listeners
        try {
          window.addEventListener('error', function(event) {
            if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason && event.reason.stack && event.reason.stack.indexOf('chrome-extension://') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);
        } catch (e) {}
      })();
    </script>
